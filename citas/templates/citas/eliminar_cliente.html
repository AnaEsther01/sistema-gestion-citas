{% extends 'citas/base.html' %}
{% block content %}
<div class="card border-danger"><div class="card-body">
<h1>Eliminar cliente</h1>
<p>¿Está seguro de que desea eliminar a <strong>{{ cliente.nombre }} {{ cliente.apellido }}</strong>?</p>
<p>También se eliminarán sus citas asociadas. Esta operación no se puede deshacer.</p>
<form method="post">{% csrf_token %}
<button class="btn btn-danger" type="submit">Sí, eliminar</button>
<a class="btn btn-secondary" href="{% url 'clientes' %}">Cancelar</a>
</form></div></div>
{% endblock %}
