{% extends 'citas/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="card-title text-center mb-4">
                    Iniciar sesión
                </h1>

                <form method="POST">
                    {% csrf_token %}

                    {{ formulario.as_p }}

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Iniciar sesión
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'registro' %}">
                        Crear una cuenta
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
