{% if formulario.non_field_errors %}<div class="form-errors" role="alert">{{ formulario.non_field_errors }}</div>{% endif %}<div class="form-fields">{% for field in formulario %}<div class="field {% if field.errors %}invalid{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required" aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="helptext">{{ field.help_text|safe }}</div>{% endif %}{% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}</div>{% endfor %}</div>
