<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Gestión de Citas{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary px-4">
        <a class="navbar-brand" href="{% url 'inicio' %}">Sistema de Gestión de Citas</a>
        {% if user.is_authenticated %}<span class="text-white">Usuario: {{ user.username }}</span>{% endif %}
    </nav>

    <div class="container mt-4">
        {% for message in messages %}<div class="alert alert-success" role="alert">{{ message }}</div>{% endfor %}
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
